services:
  - type: web
    name: ai-teammates-start
    runtime: node
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NITRO_PRESET
        value: render-com
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "24"
